name: Playwright Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: |
        npm ci

    - name: Run Playwright tests
      run: |
        npx playwright install --with-deps
        npx playwright test --reporter=html
      continue-on-error: false

    - name: Upload Playwright HTML Report as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report
    - name: Prepare email sender and recipient
      if: always()
      env:
        MAIL_FROM: ${{ secrets.MAIL_FROM }}
        MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        MAIL_TO: ${{ secrets.MAIL_TO }}
      run: |
        # set REPORT_FROM to MAIL_FROM or fall back to MAIL_USERNAME
        if [ -n "$MAIL_FROM" ]; then
          echo "REPORT_FROM=$MAIL_FROM" >> $GITHUB_ENV
        else
          echo "REPORT_FROM=$MAIL_USERNAME" >> $GITHUB_ENV
        fi
        # set REPORT_TO to MAIL_TO or fall back to MAIL_USERNAME
        if [ -n "$MAIL_TO" ]; then
          echo "REPORT_TO=$MAIL_TO" >> $GITHUB_ENV
        else
          echo "REPORT_TO=$MAIL_USERNAME" >> $GITHUB_ENV
        fi

    - name: Send test report email
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ secrets.MAIL_HOST }}
        server_port: ${{ secrets.MAIL_PORT }}
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "Playwright tests - ${{ github.repository }} - ${{ github.ref }} - ${{ job.status }}"
        body: |
          Playwright tests completed for `${{ github.ref }}`.
          Job status: `${{ job.status }}`.
          See attached report or view the workflow run for details.
        to: ${{ env.REPORT_TO }}
        from: ${{ env.REPORT_FROM }}
        secure: true
        # Attach the HTML report folder (zips if needed)
        attachments: playwright-report/**
