name: Playwright Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: |
        npm ci

    - name: Run Playwright tests
      run: |
        npx playwright install --with-deps
        npx playwright test --reporter=html
      continue-on-error: false

    - name: Zip Playwright HTML Report
      if: always()
      run: |
        python - <<'PY'
          import shutil
          import pathlib
          report_dir = pathlib.Path('playwright-report')
          if report_dir.exists() and report_dir.is_dir():
              shutil.make_archive('playwright-report', 'zip', report_dir)
        PY

    - name: Upload Playwright HTML Report as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          playwright-report
          playwright-report.zip

    - name: Prepare email sender and SMTP settings
      if: always()
      env:
        MAIL_FROM: ${{ secrets.MAIL_FROM }}
        MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        MAIL_TO: ${{ secrets.MAIL_TO }}
        MAIL_HOST: ${{ secrets.MAIL_HOST }}
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
        MAIL_PORT: ${{ secrets.MAIL_PORT }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
      run: |
        # set REPORT_FROM to MAIL_FROM or fall back to MAIL_USERNAME
        if [ -n "$MAIL_FROM" ]; then
          echo "REPORT_FROM=$MAIL_FROM" >> $GITHUB_ENV
        else
          echo "REPORT_FROM=$MAIL_USERNAME" >> $GITHUB_ENV
        fi
        # set REPORT_TO to MAIL_TO or fall back to MAIL_USERNAME
        if [ -n "$MAIL_TO" ]; then
          echo "REPORT_TO=$MAIL_TO" >> $GITHUB_ENV
        else
          echo "REPORT_TO=$MAIL_USERNAME" >> $GITHUB_ENV
        fi
        # prefer MAIL_HOST, then SMTP_HOST, then MAIL_SERVER
        if [ -n "$MAIL_HOST" ]; then
          echo "REPORT_SMTP_HOST=$MAIL_HOST" >> $GITHUB_ENV
        elif [ -n "$SMTP_HOST" ]; then
          echo "REPORT_SMTP_HOST=$SMTP_HOST" >> $GITHUB_ENV
        elif [ -n "$MAIL_SERVER" ]; then
          echo "REPORT_SMTP_HOST=$MAIL_SERVER" >> $GITHUB_ENV
        else
          # infer SMTP host from MAIL_USERNAME domain when host secret is missing
          if [[ "$MAIL_USERNAME" == *"@gmail.com" ]]; then
            echo "REPORT_SMTP_HOST=smtp.gmail.com" >> $GITHUB_ENV
          elif [[ "$MAIL_USERNAME" == *"@outlook.com" ]] || [[ "$MAIL_USERNAME" == *"@hotmail.com" ]] || [[ "$MAIL_USERNAME" == *"@live.com" ]]; then
            echo "REPORT_SMTP_HOST=smtp.office365.com" >> $GITHUB_ENV
          elif [[ "$MAIL_USERNAME" == *"@yahoo.com" ]]; then
            echo "REPORT_SMTP_HOST=smtp.mail.yahoo.com" >> $GITHUB_ENV
          elif [[ "$MAIL_USERNAME" == *"@mailtrap.io" ]]; then
            echo "REPORT_SMTP_HOST=smtp.mailtrap.io" >> $GITHUB_ENV
          else
            DOMAIN=${MAIL_USERNAME#*@}
            echo "REPORT_SMTP_HOST=smtp.$DOMAIN" >> $GITHUB_ENV
          fi
        fi
        # prefer MAIL_PORT, then SMTP_PORT, default to 587
        if [ -n "$MAIL_PORT" ]; then
          echo "REPORT_SMTP_PORT=$MAIL_PORT" >> $GITHUB_ENV
        elif [ -n "$SMTP_PORT" ]; then
          echo "REPORT_SMTP_PORT=$SMTP_PORT" >> $GITHUB_ENV
        else
          echo "REPORT_SMTP_PORT=587" >> $GITHUB_ENV
        fi

    - name: Send test report email
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ env.REPORT_SMTP_HOST }}
        server_port: ${{ env.REPORT_SMTP_PORT }}
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "Playwright tests - ${{ github.repository }} - ${{ github.ref }} - ${{ job.status }}"
        body: |
          Playwright tests completed for `${{ github.ref }}`.
          Job status: `${{ job.status }}`.
          See attached report or view the workflow run for details.
        to: ${{ env.REPORT_TO }}
        from: ${{ env.REPORT_FROM }}
        secure: ${{ env.REPORT_SMTP_PORT == '465' }}
        attachments: playwright-report.zip
