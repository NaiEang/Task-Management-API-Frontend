name: UI Tests
on:
  push:
    branches: [ main, master ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # <--- This MUST be 20 or 22
      - name: Install
        run: npm install
      - name: Playwright
        run: npx playwright install --with-deps
      - name: Run
        run: npx playwright test